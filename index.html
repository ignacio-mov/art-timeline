<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pon a prueba tu conocimiento del arte ordenando obras maestras a través del tiempo.">
  <meta name="theme-color" content="#101114">
  <title>Art Timeline | Juego de historia del arte</title>
  <link rel="stylesheet" href="styles.css?v=art-timeline-2026-10-31-3">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AT</div>
      <div class="brand-copy">
        <p class="eyebrow">Cronología del arte</p>
        <h1>Art Timeline</h1>
      </div>
    </div>
    <div class="stats" aria-label="Estadísticas de la partida">
      <div class="stat">
        <span class="stat-label">Puntuación</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Récord</span>
        <span class="stat-value" id="high-score">0</span>
      </div>
    </div>
  </header>

  <div class="game-over-banner" id="game-over-banner">
    <h2>¡Fin del juego!</h2>
    <div class="failed-info" id="failed-artwork-info"></div>
    <div class="banner-stats">
      Puntuación obtenida: <strong id="final-score">0</strong> | Récord actual: <strong id="final-high-score">0</strong>
    </div>
    <button class="btn" type="button" id="restart-button">Jugar de nuevo</button>
  </div>

  <main>
    <div class="status-panel info" id="status-panel" aria-live="polite" aria-atomic="true">
      <div class="status-text" id="status-text">Coloca la obra en su sitio histórico.</div>
    </div>

    <div class="timeline-wrapper" id="timeline-wrapper">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="deck-area" id="deck-area">
      <h2>Toca un hueco directo o arrastra la carta:</h2>
      <p class="deck-hint">Haz clic en cualquier imagen para verla más grande.</p>
      <div id="current-card-container"></div>
    </div>
  </main>

  <div class="lightbox-overlay" id="lightbox-overlay" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <div class="lightbox-content" tabindex="-1">
      <button class="lightbox-close" type="button" aria-label="Cerrar vista ampliada" id="close-lightbox">&times;</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption">
        <h3 id="lightbox-title"></h3>
        <p id="lightbox-details"></p>
      </div>
    </div>
  </div>

  <script src="script.js?v=art-timeline-2026-10-31-3" defer></script>
</body>
</html>
